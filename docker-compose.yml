version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: burujuljaya
        uid: 1000
    image: burujuljaya-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - burujuljaya-network

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx/burujuljaya.conf:/etc/nginx/conf.d/default.conf
    networks:
      - burujuljaya-network
    depends_on:
      - app

networks:
  burujuljaya-network:
    driver: bridge
